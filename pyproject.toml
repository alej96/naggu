[project]
name = "naggu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "av>=18.1.0",
    "diffusers>=0.40.0",
    "huggingface-hub>=1.29.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
